name: Java compatibility

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Java ${{ matrix.java }} runtime
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 27 ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install test JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Install development JDK 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27
          cache: gradle

      - name: Build with JDK 27 and test on JDK ${{ matrix.java }}
        run: ./gradlew clean build spotlessCheck --no-daemon -PtestJavaVersion=${{ matrix.java }}
